<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Sergey Mechtaev - {{ page_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      {#
        Design system
        =============
        The page has no boxes. Grouping is carried by typeface, ink and space.

        Typeface says what a thing is: serif for what the reader reads (names,
        titles, prose), sans for the apparatus around it (labels, dates,
        venues, link rows) — always smaller and lighter, so it recedes.

        Five type sizes, four inks on one paper, and three vertical gaps.
        Each gap is roughly twice the one below it, so the distance between
        two things always says unambiguously whether they belong together:
        `row` inside a list, `block` from a label to its content, `section`
        between sections. That ratio is what the frames used to do.
      #}
      @theme {
        --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-serif: "Source Serif 4", ui-serif, Georgia, serif;

        /* Type scale: 12 / 14 / 16 / 20 / 26 px. */
        --text-label: 0.75rem;
        --text-label--line-height: 1.4;
        --text-meta: 0.875rem;
        --text-meta--line-height: 1.5;
        --text-body: 1rem;
        --text-body--line-height: 1.6;
        --text-title: 1.25rem;
        --text-title--line-height: 1.3;
        --text-name: 1.625rem;
        --text-name--line-height: 1.2;

        /* Vertical rhythm: row < block < section, at 1 : 1.5 : 3. */
        --spacing-row: 1rem;
        --spacing-block: 1.5rem;
        --spacing-section: 3rem;

        /* Warm neutrals on paper, one accent. */
        --color-paper: #faf9f7;
        --color-ink: #26231f;
        --color-muted: #6b655d;
        --color-faint: #a09a91;
        --color-rule: #e4e0d9;
        --color-accent: #0f766e;
        --color-award: #9a6b1f;
      }

      /* --- Page: margins and measure, never a box --------------------- */
      .canvas { @apply w-full max-w-360 mx-auto px-6 sm:px-10 py-12 sm:py-16; }
      .measure { @apply w-full max-w-3xl mx-auto px-6 sm:px-10 py-12 sm:py-16; }

      /* --- Sections ---------------------------------------------------- */
      .section-label {
        @apply block font-sans text-label font-medium uppercase tracking-[0.14em]
               text-faint border-b border-rule pb-2 mb-block;
      }
      {# `rows` for one-line-per-fact lists, `rows-loose` where each entry is
         itself several lines and needs the wider gap to stay one entry. #}
      .rows { @apply flex flex-col gap-row; }
      .rows-loose { @apply flex flex-col gap-block; }

      /* --- Entries ----------------------------------------------------- */
      .entry-title { @apply font-serif font-semibold text-ink text-body leading-snug; }
      .entry-body { @apply font-serif text-ink text-body; }
      .entry-meta { @apply font-sans text-muted text-meta; }
      .entry-note { @apply font-sans text-faint text-meta; }

      /* --- Links ------------------------------------------------------- */
      @utility link {
        color: var(--color-accent);
        text-decoration-line: underline;
        text-decoration-color: color-mix(in oklab, var(--color-accent) 35%, transparent);
        text-underline-offset: 3px;
        transition: text-decoration-color 150ms;
        &:hover { text-decoration-color: var(--color-accent); }
      }
      .link-row { @apply flex flex-wrap gap-x-5 gap-y-1 font-sans text-meta; }

      /* --- Markdown prose ---------------------------------------------- */
      .prose { @apply font-serif text-ink text-body; }
      .prose h1 { @apply font-serif font-semibold text-ink text-title mt-section mb-block; }
      .prose h2 { @apply font-serif font-semibold text-ink text-body mt-block mb-2; }
      .prose h3 { @apply font-sans font-semibold text-muted text-meta mt-block mb-2; }
      .prose > :first-child { @apply mt-0; }
      .prose p { @apply mb-block; }
      .prose ul { @apply list-disc pl-5 mb-block space-y-2; }
      .prose ol { @apply list-decimal pl-5 mb-block space-y-2; }
      .prose a { @apply link; }
      .prose strong { @apply font-semibold; }
      .prose em { @apply italic; }
      .prose code { @apply font-mono text-muted text-meta; }
      .prose > :last-child { @apply mb-0; }
    </style>
  </head>
  <body class="bg-paper text-ink font-serif antialiased">
    {% block content %}{% endblock %}
  </body>
</html>
