{% extends "overview_card.html" %}

{% block title %}
News
{% endblock %}

{% block content %}
<div class="grid grid-cols-[auto_minmax(0,1fr)] items-baseline gap-x-5 gap-y-row">
  {% for n in news[:5] %}
  <span class="entry-note tabular-nums">{{ '%02d' | format(n.date.day) }}/{{ '%02d' | format(n.date.month) }}/{{ n.date.year - 2000 }}</span>
  <span class="entry-body">{{ n.text }}</span>
  {% endfor %}
</div>
{% endblock %}
