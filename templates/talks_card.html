{% extends "overview_card.html" %}

{% block title %}
Talks
{% endblock %}

{% block content %}
<div class="grid grid-cols-[auto_minmax(0,1fr)] items-baseline gap-x-5 gap-y-block">
  {% for t in talks[:3] %}
  <span class="entry-note whitespace-nowrap">{{ month_name(t.date.month)[:3] }} {{ t.date.year }}</span>
  <div>
    <p class="entry-title">{{ t.title }}</p>
    <p class="entry-meta">{{ t.host }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
